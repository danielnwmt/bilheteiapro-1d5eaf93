# ============================================================
# BilheteIA PRO — instalação 1 CLIQUE com banco LOCAL.
# Imagem tudo-em-um: Postgres + Auth + API + app num único
# container, na mesma porta. Basta "subir" no painel da Localweb.
# ============================================================

services:
  app:
    build:
      context: .
      args:
        # A URL da API precisa ser gravada no frontend no build.
        # Depois do SSL, o watcher troca SUPABASE_PUBLIC_URL para https://dominio
        # e o deploy reconstrói com essa URL, evitando "Failed to fetch".
        VITE_SUPABASE_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
        VITE_SUPABASE_PROJECT_ID: local
        SUPABASE_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}
    container_name: bia-app
    restart: always
    environment:
      # Deixe vazio para detectar o IP público automaticamente.
      # Em domínio/HTTPS, defina ex.: https://seu-dominio.com.br
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Defina ADMIN_EMAIL no arquivo .env do servidor}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina uma senha forte em ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET com no mínimo 32 caracteres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD com uma senha forte}
      ANON_KEY: ${ANON_KEY:-}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      CRON_SECRET: ${CRON_SECRET:-}
      PORT: ${APP_PORT:-3000}
      # Arquivo-gatilho do botão "Atualizar sistema" (compartilhado com o host).
      DEPLOY_TRIGGER_FILE: /opt/app/deploy-trigger/request
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    volumes:
      - bia-db-data:/var/lib/postgresql/data
      # Pasta compartilhada com o host: o app grava o gatilho aqui e o
      # watcher (update-watcher.sh) no host roda o deploy.sh.
      - ./deploy-trigger:/opt/app/deploy-trigger

  # ---------- Agendador (cron) — busca jogos/odds e executa o motor estatístico ----------
  # Sem este serviço a instalação local NUNCA busca odds nem executa a análise do
  # motor estatístico, então o cliente vê "Nenhuma entrada encontrada". Ele acorda a cada 60s
  # e cada endpoint respeita seu próprio intervalo interno (7 min).
  cron:
    image: curlimages/curl:8.10.1
    container_name: bia-cron
    restart: always
    depends_on:
      - app
    environment:
      APP_PORT: ${APP_PORT:-3000}
      CRON_SECRET: ${CRON_SECRET:?Defina CRON_SECRET com um valor aleatório forte}
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "[cron] iniciado — verifica a cada 60s (jogos, odds e motor estatístico)";
        H="x-cron-secret: $${CRON_SECRET:-local-cron-secret}";
        while true; do
          # 1) Jogos + odds (respeita o intervalo interno da chave).
          curl -s -X POST -H "$$H" "http://app:${APP_PORT:-3000}/api/public/hooks/sync-football" >/dev/null 2>&1 || true;
          # 2) Odds diárias (The Odds API) como reforço.
          curl -s -X POST -H "$$H" "http://app:${APP_PORT:-3000}/api/public/hooks/sync-odds-diario" >/dev/null 2>&1 || true;
          # 3) O motor estatístico analisa os jogos com odds e preenche o analise_cache.
          curl -s -X POST -H "$$H" "http://app:${APP_PORT:-3000}/api/public/hooks/analisar-jogos" >/dev/null 2>&1 || true;
          sleep 60;
        done

volumes:
  bia-db-data:
